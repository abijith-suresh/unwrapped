name: CI

on: pull_request

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun-quality:
    name: bun-quality
    uses: abijith-suresh/workflows/.github/workflows/bun-quality.yml@163055ac24b4169ae93ae05c5d7491b1cd5d96c7 # v0.6.0
    permissions:
      contents: read

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5

  quality:
    name: quality
    runs-on: ubuntu-latest
    if: always()
    needs: [bun-quality, dependency-review]

    steps:
      - name: Verify required checks passed
        env:
          BUN_QUALITY_RESULT: ${{ needs.bun-quality.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          if [[ "$BUN_QUALITY_RESULT" != "success" || "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
            echo "bun-quality: $BUN_QUALITY_RESULT"
            echo "dependency-review: $DEPENDENCY_REVIEW_RESULT"
            exit 1
          fi
