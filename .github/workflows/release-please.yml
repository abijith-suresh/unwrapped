name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    uses: abijith-suresh/workflows/.github/workflows/release-please.yml@6838f8e2495013c024606bbf8d63d3d5c66344fa # 0.8.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
