name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    uses: abijith-suresh/workflows/.github/workflows/release-please.yml@9c9e55ab629eafe5b5edbae9857b1d66fb384f8c # 0.8.1
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
